<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List (Local Storage)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        input { width: 70%; padding: 10px; }
        button { padding: 10px; background: #1a5242; color: white; border: none; cursor: pointer; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { background: #eee; margin: 5px 0; padding: 10px; display: flex; justify-content: space-between; }
        .delete { background: red; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html">← Back to Portfolio</a>
        <h2>Task Tracker</h2>
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button onclick="addTask()">Add</button>
        <ul id="taskList"></ul>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", loadTasks);

        function addTask() {
            const input = document.getElementById("taskInput");
            if (input.value.trim() === "") return;
            const tasks = getTasks();
            tasks.push(input.value);
            localStorage.setItem("tasks", JSON.stringify(tasks));
            input.value = "";
            renderTasks();
        }

        function removeTask(index) {
            const tasks = getTasks();
            tasks.splice(index, 1);
            localStorage.setItem("tasks", JSON.stringify(tasks));
            renderTasks();
        }

        function getTasks() {
            return JSON.parse(localStorage.getItem("tasks")) || [];
        }

        function renderTasks() {
            const list = document.getElementById("taskList");
            list.innerHTML = "";
            getTasks().forEach((task, index) => {
                list.innerHTML += `<li>${task} <button class="delete" onclick="removeTask(${index})">X</button></li>`;
            });
        }

        function loadTasks() { renderTasks(); }
    </script>
</body>
</html>
